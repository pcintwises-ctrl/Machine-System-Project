<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MachineSync Pro | Advanced Maintenance Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        body { font-family: 'Inter', 'Kanit', sans-serif; overflow: hidden; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .sidebar-btn { width: 100%; text-align: left; padding: 12px 16px; border-radius: 12px; transition: all 0.3s; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; }
        .sidebar-btn:hover { background: rgba(37, 99, 235, 0.1); color: #2563eb; }
        .sidebar-btn.active { background: #2563eb; color: white; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }

        .calendar-grid div { height: 24px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; }
        .today { background: #2563eb; color: white; border-radius: 6px; width: 20px; height: 20px; }

        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass-panel { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); }

        #log-container::-webkit-scrollbar { width: 4px; }
        #log-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .active-filter { background: #2563eb !important; color: white !important; }
    </style>
</head>
<body class="bg-[#f1f5f9] dark:bg-slate-950 h-screen flex flex-col text-slate-700 dark:text-slate-200">

    <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-8 shrink-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">M</div>
            <h1 class="text-lg font-bold tracking-tight uppercase italic text-slate-900 dark:text-white">MachineSync <span class="text-blue-600">Pro</span></h1>
        </div>
        <div class="flex items-center gap-8">
            <div class="text-right border-r dark:border-slate-800 pr-6">
                <p id="nav-clock" class="text-base font-semibold font-mono text-blue-600 leading-none">00:00:00</p>
                <p id="nav-date" class="text-[10px] text-slate-400 font-bold uppercase">Loading...</p>
            </div>
            <button onclick="toggleTheme()" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-sm">
                <span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-5 flex flex-col shrink-0">
            <nav class="flex-1 space-y-2">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 ml-2">Navigation</p>
                <button onclick="showHome()" id="btn-home" class="sidebar-btn active">🏠 Overview</button>
                <button onclick="showTab('manage-tab')" id="btn-manage" class="sidebar-btn">🛠️ Intel Search</button>
                <button onclick="showTab('add-tab')" id="btn-add" class="sidebar-btn">➕ เพิ่มปัญหาใหม่</button>
                <button onclick="showTab('db-tab'); fetchAllRecords();" id="btn-db" class="sidebar-btn">🗄️ Database</button>
                <button onclick="showTab('summary-tab'); updateAnalytics('week');" id="btn-summary" class="sidebar-btn">📊 สถิติ</button>
            </nav>
            
            <div class="mt-auto pt-6 border-t border-slate-100 dark:border-slate-800">
                <div class="bg-slate-50 dark:bg-slate-950 p-4 rounded-xl border border-slate-200 dark:border-slate-800 text-center">
                    <p id="cal-month" class="text-[10px] font-bold text-blue-600 uppercase mb-2">Calendar</p>
                    <div class="grid grid-cols-7 text-center text-[9px] text-slate-400 font-bold mb-2">
                        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                    </div>
                    <div id="calendar-days" class="grid grid-cols-7 gap-y-1"></div>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden relative">
            <section class="flex-1 p-8 overflow-y-auto">
                
                <div id="home-state" class="max-w-4xl mx-auto animate-in fade-in duration-700">
                    <div class="relative w-full bg-white dark:bg-slate-900 p-4 rounded-[2rem] shadow-2xl border dark:border-slate-800 overflow-hidden">
                        <img src="sony_logo.jpg" class="w-full h-80 object-cover rounded-[1.5rem]" alt="Sony Visual">
                        <div class="mt-6 text-center">
                            <h2 class="text-2xl font-bold text-slate-800 dark:text-white">ยินดีต้อนรับสู่ MachineSync Pro</h2>
                            <p class="text-slate-500 mt-2">กรุณาเลือกเมนูจากแถบด้านซ้ายเพื่อเริ่มต้นการใช้งาน</p>
                        </div>
                    </div>
                </div>

                <div id="manage-tab" class="tab-content">
                    <div class="max-w-3xl mx-auto glass-panel p-8 rounded-3xl shadow-xl space-y-6">
                        <h2 class="text-xl font-bold text-blue-600 uppercase">Intelligence Base Search</h2>
                        <div class="flex gap-2 relative">
                            <div class="relative flex-1">
                                <input type="text" id="search-input" oninput="handleSuggest(this.value, 'search-input', 'search-suggestion-list')" placeholder="ป้อน Machine ID..." class="w-full bg-white dark:bg-slate-950 border rounded-xl p-4 outline-none focus:ring-2 ring-blue-500/50 uppercase">
                                <ul id="search-suggestion-list" class="absolute top-full left-0 w-full mt-2 bg-white dark:bg-slate-900 border rounded-xl shadow-2xl hidden z-50 overflow-hidden"></ul>
                            </div>
                            <button onclick="executeSearch()" class="px-8 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">ANALYZE</button>
                        </div>

                        <div id="search-history-container" class="hidden animate-in fade-in">
                            <p class="text-[10px] font-bold text-blue-500 mb-1 uppercase ml-1">ประวัติปัญหาของเครื่องนี้:</p>
                            <select id="search-history-dropdown" onchange="document.getElementById('search-input').value = this.value; executeSearch();" 
                                class="w-full p-3 bg-slate-50 dark:bg-slate-900 border rounded-xl outline-none text-sm cursor-pointer">
                                <option value="">-- เลือกปัญหาที่เคยเกิดขึ้น --</option>
                            </select>
                        </div>
                        <div id="search-results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    </div>
                </div>

                <div id="add-tab" class="tab-content">
                    </div>
                <div id="db-tab" class="tab-content">
                    </div>
                <div id="summary-tab" class="tab-content">
                    </div>

            </section>

            <footer class="h-32 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 p-5 flex flex-col shrink-0">
                <h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Diagnostic Stream (log)
                </h3>
                <div id="log-container" class="flex-1 overflow-y-auto font-mono text-[11px] space-y-1 text-emerald-500 h-full">
                    <p>>> MachineSync Pro OS v3.5 initialized... OK</p>
                </div>
            </footer>
        </main>
    </div>

    <script>
        const BACKEND_URL = 'https://machine-api-fcm8.onrender.com';
        let machineNames = [];
        let machineData = []; 
        let myChart = null;

        // ฟังก์ชันจัดการ Suggestion (Case-insensitive)
        function handleSuggest(val, inputId, listId) {
            const list = document.getElementById(listId);
            list.innerHTML = '';
            if (!val) { list.classList.add('hidden'); return; }
            
            const filtered = machineNames.filter(n => n.toLowerCase().includes(val.toLowerCase()));
            if (filtered.length > 0) {
                filtered.forEach(name => {
                    const li = document.createElement('li');
                    li.className = 'p-3 border-b dark:border-slate-800 hover:bg-blue-50 dark:hover:bg-slate-800 cursor-pointer text-xs font-bold';
                    li.textContent = name.toUpperCase();
                    li.onclick = () => { 
                        document.getElementById(inputId).value = name; 
                        list.classList.add('hidden'); 
                        if(inputId === 'search-input') fetchHistoryIssues(name, true);
                    };
                    list.appendChild(li);
                });
                list.classList.remove('hidden');
            } else { list.classList.add('hidden'); }
        }

        // ดึงประวัติปัญหามาทำ Dropdown
        async function fetchHistoryIssues(mId, isSearchTab = false) {
            if (!mId) return;
            const containerId = isSearchTab ? 'search-history-container' : 'history-issue-container';
            const dropdownId = isSearchTab ? 'search-history-dropdown' : 'history-issue-dropdown';
            
            const container = document.getElementById(containerId);
            const dropdown = document.getElementById(dropdownId);
            
            try {
                const issues = machineData
                    .filter(d => d.machine_id.toUpperCase() === mId.toUpperCase())
                    .map(d => d.description)
                    .filter((value, index, self) => self.indexOf(value) === index && value);
                
                if (issues.length > 0) {
                    dropdown.innerHTML = '<option value="">-- เลือกปัญหาที่เคยเกิดขึ้น --</option>';
                    issues.forEach(issue => dropdown.innerHTML += `<option value="${issue}">${issue}</option>`);
                    container.classList.remove('hidden');
                    addLog(`Smart Link: พบ ${issues.length} รายการปัญหาสำหรับเครื่อง ${mId.toUpperCase()}`);
                } else {
                    container.classList.add('hidden');
                }
            } catch (err) { console.error(err); }
        }

        // ปรับจูนกราฟให้สเกลเหมาะสม
        async function updateAnalytics(period = 'week') {
            // ... (Logic เดิม) ...
            myChart = new Chart(ctx, {
                type: 'bar',
                data: { /* ... */ },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            ticks: { stepSize: 1, precision: 0 }, // ปรับให้เป็นเลขจำนวนเต็มเสมอ
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        }
                    }
                }
            });
        }

        // ฟังก์ชันสลับเมนู
        function showTab(id) {
            document.getElementById('home-state').style.display = id === 'home' ? 'block' : 'none';
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar-btn').forEach(el => el.classList.remove('active'));
            if(id !== 'home') document.getElementById(id).classList.add('active');
            
            const btnMap = { 'manage-tab': 'btn-manage', 'add-tab': 'btn-add', 'db-tab': 'btn-db', 'summary-tab': 'btn-summary' };
            if(btnMap[id]) document.getElementById(btnMap[id]).classList.add('active');
            else document.getElementById('btn-home').classList.add('active');
        }

        function showHome() { showTab('home'); }
        
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            addLog(`UI Theme changed to ${isDark ? 'DARK' : 'LIGHT'}`);
        }

        function addLog(msg, type = 'info') {
            const container = document.getElementById('log-container');
            const p = document.createElement('p');
            p.className = type === 'error' ? 'text-red-500' : 'text-emerald-500';
            p.innerHTML = `>> [${new Date().toLocaleTimeString()}] ${msg}`;
            container.prepend(p);
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') document.documentElement.classList.add('dark');
            setInterval(() => {
                const now = new Date();
                document.getElementById('nav-clock').innerText = now.toLocaleTimeString('en-GB', {hour12: false});
                document.getElementById('nav-date').innerText = now.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric', weekday:'short'}).toUpperCase();
            }, 1000);
            showHome();
            loadNames(); // ฟังก์ชันดึง Machine Names จาก API
        };
    </script>
</body>
</html>
